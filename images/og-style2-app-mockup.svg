<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .brand-title { font-family: 'Outfit', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; fill: #E85B38; font-size: 52px; }
      .brand-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; fill: #FBF6EF; font-size: 24px; }
      .feature-item { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; fill: rgba(251, 246, 239, 0.88); font-size: 19px; }
      .mock-title { font-family: 'Outfit', sans-serif; font-weight: 700; fill: #1A1208; font-size: 16px; }
      .mock-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; fill: rgba(26,18,8,0.7); font-size: 12px; }
    </style>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A10" />
      <stop offset="100%" stop-color="#120B05" />
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad-2)" />
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" rx="16" />

  <!-- Left Content Area -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect width="240" height="32" rx="16" fill="rgba(232, 91, 56, 0.15)" stroke="#E85B38" stroke-width="1" />
    <text x="120" y="21" text-anchor="middle" font-family="Outfit" font-weight="700" font-size="12" fill="#E85B38" letter-spacing="1.5">APP INTERFACE PREVIEW</text>

    <!-- Title & Headline -->
    <text x="0" y="95" class="brand-title">PDX FOOD WEEK</text>
    <text x="0" y="140" class="brand-sub">The ultimate Portland food crawl planner</text>

    <!-- Divider -->
    <line x1="0" y1="175" x2="480" y2="175" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

    <!-- Feature Checklist -->
    <g transform="translate(0, 215)">
      <g transform="translate(0, 0)">
        <circle cx="12" cy="8" r="10" fill="rgba(52, 168, 83, 0.2)" />
        <text x="12" y="12" text-anchor="middle" fill="#34A853" font-size="12" font-weight="bold">✓</text>
        <text x="34" y="14" class="feature-item">Interactive Map &amp; Multi-Stop Route Crawls</text>
      </g>
      <g transform="translate(0, 50)">
        <circle cx="12" cy="8" r="10" fill="rgba(52, 168, 83, 0.2)" />
        <text x="12" y="12" text-anchor="middle" fill="#34A853" font-size="12" font-weight="bold">✓</text>
        <text x="34" y="14" class="feature-item">Tinder-style Swipe Triage &amp; Saved Lists</text>
      </g>
      <g transform="translate(0, 100)">
        <circle cx="12" cy="8" r="10" fill="rgba(52, 168, 83, 0.2)" />
        <text x="12" y="12" text-anchor="middle" fill="#34A853" font-size="12" font-weight="bold">✓</text>
        <text x="34" y="14" class="feature-item">Friend Group List Overlap &amp; Magic Links</text>
      </g>
      <g transform="translate(0, 150)">
        <circle cx="12" cy="8" r="10" fill="rgba(52, 168, 83, 0.2)" />
        <text x="12" y="12" text-anchor="middle" fill="#34A853" font-size="12" font-weight="bold">✓</text>
        <text x="34" y="14" class="feature-item">100% Free • No Sign-up Required</text>
      </g>
    </g>
  </g>

  <!-- Right App Phone Mockup Frame -->
  <g transform="translate(680, 65)" filter="url(#shadow-card)">
    <!-- Device Frame -->
    <rect width="440" height="500" rx="24" fill="#FBF6EF" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
    
    <!-- App Header Bar -->
    <rect width="440" height="60" rx="24" fill="#1A1208" />
    <rect y="40" width="440" height="20" fill="#1A1208" />
    <text x="24" y="38" font-family="Outfit" font-weight="700" font-size="15" fill="#E85B38" letter-spacing="2">PDX FOOD WEEK</text>
    <rect x="330" y="20" width="86" height="26" rx="13" fill="#E85B38" />
    <text x="373" y="37" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="11" fill="#FFFFFF">🍕 Pizza '26</text>

    <!-- Simulated Map UI Block -->
    <g transform="translate(20, 80)">
      <rect width="400" height="220" rx="12" fill="#E8E0D5" stroke="rgba(26,18,8,0.1)" stroke-width="1" />
      <!-- Road lines -->
      <path d="M 0 100 Q 150 40 400 140" fill="none" stroke="#FFFFFF" stroke-width="8" />
      <path d="M 120 0 L 180 220" fill="none" stroke="#FFFFFF" stroke-width="6" />
      <path d="M 280 0 L 250 220" fill="none" stroke="#FFFFFF" stroke-width="6" />
      <!-- Map Pins -->
      <g transform="translate(140, 70)">
        <circle cx="0" cy="0" r="16" fill="#E85B38" />
        <text x="0" y="5" text-anchor="middle" font-size="11" fill="#FFF">🍕</text>
      </g>
      <g transform="translate(240, 110)">
        <circle cx="0" cy="0" r="16" fill="#2E7D32" />
        <text x="0" y="5" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
      </g>
      <g transform="translate(310, 50)">
        <circle cx="0" cy="0" r="14" fill="#E85B38" />
        <text x="0" y="4" text-anchor="middle" font-size="10" fill="#FFF">🍕</text>
      </g>
      <!-- Crawl Route Polyline -->
      <path d="M 140 70 L 240 110 L 310 50" fill="none" stroke="#E85B38" stroke-width="3" stroke-dasharray="6,4" />
    </g>

    <!-- Simulated Dish Cards Stack -->
    <g transform="translate(20, 315)">
      <rect width="400" height="75" rx="10" fill="#FFFFFF" stroke="rgba(26,18,8,0.08)" stroke-width="1" />
      <rect x="12" y="12" width="50" height="50" rx="8" fill="#F5E6DF" />
      <text x="37" y="42" text-anchor="middle" font-size="22">🍕</text>
      <text x="76" y="34" class="mock-title">Hot Honey Pepperoni Slice</text>
      <text x="76" y="52" class="mock-sub">Baby Doll Pizza • SE Stark St • $4 Slice</text>
      <rect x="330" y="24" width="56" height="26" rx="6" fill="#E85B38" />
      <text x="358" y="41" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="11" fill="#FFF">Saved</text>
    </g>

    <g transform="translate(20, 400)">
      <rect width="400" height="75" rx="10" fill="#FFFFFF" stroke="rgba(26,18,8,0.08)" stroke-width="1" />
      <rect x="12" y="12" width="50" height="50" rx="8" fill="#F5E6DF" />
      <text x="37" y="42" text-anchor="middle" font-size="22">🍔</text>
      <text x="76" y="34" class="mock-title">Smokey Bacon Smash Burger</text>
      <text x="76" y="52" class="mock-sub">Midcity Smash Burger • SE Ankeny • $10</text>
      <rect x="330" y="24" width="56" height="26" rx="6" fill="rgba(26,18,8,0.08)" />
      <text x="358" y="41" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="11" fill="#1A1208">+ Save</text>
    </g>
  </g>
</svg>
