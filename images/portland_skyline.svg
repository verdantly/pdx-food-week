    <line x1="440" y1="142" x2="500" y2="142" />
    <line x1="440" y1="154" x2="500" y2="154" />
    <line x1="440" y1="166" x2="500" y2="166" />
    <line x1="440" y1="178" x2="500" y2="178" />
    <line x1="440" y1="190" x2="500" y2="190" />

    <!-- 7. Church Twin Spires (St. Mary's / St. James) -->
    <path d="M 515 210 L 515 185 L 530 185 L 530 135 L 540 100 L 550 135 L 550 185 L 570 185 L 570 135 L 580 100 L 590 135 L 590 185 L 605 185 L 605 210" />
    <path d="M 550 210 L 550 170 L 570 170 L 570 210" />
    <path d="M 553 210 L 553 185 Q 560 175 567 185 L 567 210 Z" />
    <line x1="540" y1="100" x2="540" y2="90" />
    <line x1="580" y1="100" x2="580" y2="90" />

    <!-- 8. Mid-rise background block -->
    <path d="M 610 210 L 610 145 L 665 145 L 665 210" />

    <!-- 9. Hawthorne / Steel Bridge Lift Towers & Truss Bridge Spanning Right -->
    <!-- Tower 1 -->
    <path d="M 675 210 L 675 140 L 690 140 L 690 210" />
    <line x1="675" y1="150" x2="690" y2="160" />
    <line x1="675" y1="170" x2="690" y2="180" />
    <line x1="675" y1="190" x2="690" y2="200" />

    <!-- Building behind bridge -->
    <path d="M 695 210 L 695 135 L 755 135 L 755 210" />
    <line x1="700" y1="145" x2="750" y2="145" />
    <line x1="700" y1="155" x2="750" y2="155" />
    <line x1="700" y1="165" x2="750" y2="165" />

    <!-- Tower 2 -->
    <path d="M 760 210 L 760 135 L 775 135 L 775 210" />
    <line x1="760" y1="145" x2="775" y2="155" />
    <line x1="760" y1="165" x2="775" y2="175" />
    <line x1="760" y1="185" x2="775" y2="195" />

    <!-- Bridge Deck Line across Willamette River -->
    <path d="M 660 195 L 1020 195" stroke-width="2" />
    <path d="M 660 205 L 1020 205" />

    <!-- Bridge Truss Arches -->
    <path d="M 660 195 Q 710 170 760 195" />
    <path d="M 775 195 Q 860 165 945 195" />
    <path d="M 945 195 Q 980 175 1020 195" />

