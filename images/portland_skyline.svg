    <line x1="280" y1="140" x2="330" y2="140" />

    <!-- Building 5: Hotel / Office Facade -->
    <path d="M 345 210 L 345 140 L 415 140 L 415 210" />
    <rect x="355" y="150" width="50" height="45" />
    <line x1="355" y1="161" x2="405" y2="161" />
    <line x1="355" y1="172" x2="405" y2="172" />
    <line x1="355" y1="183" x2="405" y2="183" />

