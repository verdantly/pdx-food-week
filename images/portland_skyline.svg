<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMax meet" width="100%" height="100%">
  <g fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Baseline -->
    <line x1="80" y1="210" x2="1120" y2="210" />

    <!-- 1. Oregon Convention Center Glass Dome (Far Left) -->
    <path d="M 100 210 L 100 195 L 110 185 L 150 185 L 160 195 L 160 210" />
    <path d="M 105 195 C 115 170 145 170 155 195" />
    <line x1="118" y1="180" x2="142" y2="180" />
    <line x1="124" y1="172" x2="136" y2="172" />
    <line x1="100" y1="202" x2="160" y2="202" />

    <!-- Building 2: Mid-rise facade with arch -->
    <path d="M 170 210 L 170 160 L 235 160 L 235 210" />
    <path d="M 180 210 L 180 170 L 225 170 L 225 210" />
    <path d="M 190 200 Q 202.5 180 215 200 L 215 210 L 190 210 Z" />
    <line x1="180" y1="178" x2="225" y2="178" />
    <line x1="180" y1="186" x2="225" y2="186" />

    <!-- Building 3: Low-rise connector -->
    <path d="M 235 210 L 235 180 L 260 180 L 260 210" />

    <!-- 4. KOIN Center (Pyramid Roof & Spire) -->
    <path d="M 265 210 L 265 160 L 280 160 L 280 120 L 305 75 L 330 120 L 330 160 L 345 160 L 345 210" />
    <line x1="305" y1="75" x2="305" y2="55" />
