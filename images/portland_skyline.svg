    <line x1="675" y1="195" x2="685" y2="184" />
    <line x1="695" y1="195" x2="710" y2="178" />
    <line x1="725" y1="195" x2="735" y2="182" />
    <line x1="800" y1="195" x2="820" y2="178" />
    <line x1="840" y1="195" x2="860" y2="172" />
    <line x1="880" y1="195" x2="900" y2="178" />

    <!-- Bridge Piers -->
    <line x1="730" y1="205" x2="730" y2="210" />
    <line x1="860" y1="205" x2="860" y2="210" />
    <line x1="980" y1="205" x2="980" y2="210" />

    <!-- Building 10 (Far Right) -->
    <path d="M 785 180 L 785 145 L 835 145 L 835 180" />
    <path d="M 945 195 L 945 170 L 980 170 L 980 195" />
    <path d="M 1020 210 L 1020 155 L 1070 155 L 1070 210" />
    <path d="M 1045 155 L 1045 145 L 1065 145 L 1065 155" />
