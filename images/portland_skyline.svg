    <path d="M 425 210 L 425 60 L 475 60 L 475 210" />
    <path d="M 435 210 L 435 130 L 505 130 L 505 210" />
    <!-- Vertical facade lines -->
    <line x1="435" y1="65" x2="435" y2="125" />
    <line x1="445" y1="65" x2="445" y2="125" />
    <line x1="455" y1="65" x2="455" y2="125" />
    <line x1="465" y1="65" x2="465" y2="125" />
