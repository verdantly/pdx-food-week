<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&amp;family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .ed-title { font-family: 'Outfit', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; fill: #E85B38; font-size: 72px; }
      .ed-head { font-family: 'Fraunces', Georgia, serif; font-weight: 900; fill: #1A1208; font-size: 42px; line-height: 1.1; }
      .ed-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; fill: rgba(26, 18, 8, 0.75); font-size: 22px; }
      .ed-badge-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; fill: #E85B38; letter-spacing: 0.15em; text-transform: uppercase; }
      .ed-item { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 16px; fill: #1A1208; }
    </style>
  </defs>

  <!-- Background Warm Cream -->
  <rect width="1200" height="630" fill="#FBF6EF" />

  <!-- Double Border Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#1A1208" stroke-width="2" />
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="rgba(26, 18, 8, 0.15)" stroke-width="1" />

  <!-- Top Left Category Pill -->
  <g transform="translate(90, 90)">
    <rect width="280" height="34" rx="17" fill="#F5E6DF" stroke="#E85B38" stroke-width="1" />
    <text x="140" y="22" text-anchor="middle" class="ed-badge-text">PORTLAND LOCAL GUIDE</text>
  </g>

  <!-- Title & Headlines -->
  <g transform="translate(90, 190)">
    <text x="0" y="0" class="ed-title">PDX FOOD WEEK</text>
    <text x="0" y="65" class="ed-head">Your unofficial companion to Portland’s</text>
    <text x="0" y="115" class="ed-head">annual food festival season.</text>
    <text x="0" y="170" class="ed-sub">Explore $5 tacos, $10 burgers, $4 pizza slices, $10 slushies &amp; craft drinks.</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="90" y1="435" x2="1110" y2="435" stroke="rgba(26, 18, 8, 0.15)" stroke-width="1.5" />

  <!-- Bottom Horizontal Feature Tracker Bar -->
  <g transform="translate(90, 480)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="ed-item">📍 Interactive Map</text>
      <text x="0" y="24" font-family="Plus Jakarta Sans" font-size="14" fill="rgba(26,18,8,0.6)">All 300+ PDX locations</text>
    </g>
    <!-- Divider -->
    <line x1="240" y1="-10" x2="240" y2="30" stroke="rgba(26,18,8,0.15)" stroke-width="1" />
    
    <!-- Feature 2 -->
    <g transform="translate(280, 0)">
      <text x="0" y="0" class="ed-item">🚶 Food Crawl Builder</text>
      <text x="0" y="24" font-family="Plus Jakarta Sans" font-size="14" fill="rgba(26,18,8,0.6)">Multi-stop Google routing</text>
    </g>
    <!-- Divider -->
    <line x1="530" y1="-10" x2="530" y2="30" stroke="rgba(26,18,8,0.15)" stroke-width="1" />

    <!-- Feature 3 -->
    <g transform="translate(570, 0)">
      <text x="0" y="0" class="ed-item">⚡ Magic Link Sharing</text>
      <text x="0" y="24" font-family="Plus Jakarta Sans" font-size="14" fill="rgba(26,18,8,0.6)">See where list spots match</text>
    </g>
    <!-- Divider -->
    <line x1="800" y1="-10" x2="800" y2="30" stroke="rgba(26,18,8,0.15)" stroke-width="1" />

    <!-- Feature 4 -->
    <g transform="translate(840, 0)">
      <text x="0" y="0" class="ed-item" fill="#E85B38">✓ 100% Free &amp; Open</text>
      <text x="0" y="24" font-family="Plus Jakarta Sans" font-size="14" fill="rgba(26,18,8,0.6)">No login or downloads</text>
    </g>
  </g>
</svg>
