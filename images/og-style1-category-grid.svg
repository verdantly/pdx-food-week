<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; fill: #E85B38; }
      .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; fill: #FBF6EF; font-size: 26px; }
      .chip-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; fill: rgba(251, 246, 239, 0.9); text-transform: uppercase; }
      .pill-text { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 16px; fill: #1A1208; }
      .footer-badge { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 15px; fill: rgba(251, 246, 239, 0.75); }
    </style>
    <radialGradient id="bg-glow-1" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#3A2B1C" />
      <stop offset="100%" stop-color="#1A1208" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-glow-1)" />
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(232, 91, 56, 0.25)" stroke-width="1.5" rx="16" />

  <g transform="translate(435, 75)">
    <rect width="330" height="36" rx="18" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="24" cy="18" r="4" fill="#34A853" />
    <text x="38" y="23" class="chip-text">PORTLAND'S FOOD WEEK COMPANION</text>
  </g>

  <text x="600" y="185" text-anchor="middle" class="title" font-size="64">PDX FOOD WEEK</text>
  <text x="600" y="240" text-anchor="middle" class="tagline">Save favorites, explore interactive maps &amp; route food crawls with friends</text>

  <line x1="200" y1="280" x2="1000" y2="280" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <g transform="translate(130, 315)">
    <g transform="translate(0, 0)"><rect width="180" height="46" rx="23" fill="#FFF8EE" /><text x="90" y="29" text-anchor="middle" class="pill-text">🍔 Burger Week</text></g>
    <g transform="translate(196, 0)"><rect width="165" height="46" rx="23" fill="#FFF8EE" /><text x="82.5" y="29" text-anchor="middle" class="pill-text">🌮 Taco Week</text></g>
    <g transform="translate(377, 0)"><rect width="165" height="46" rx="23" fill="#FFF8EE" /><text x="82.5" y="29" text-anchor="middle" class="pill-text">🍕 Pizza Week</text></g>
    <g transform="translate(558, 0)"><rect width="190" height="46" rx="23" fill="#FFF8EE" /><text x="95" y="29" text-anchor="middle" class="pill-text">🍹 Highball Week</text></g>
    <g transform="translate(764, 0)"><rect width="176" height="46" rx="23" fill="#FFF8EE" /><text x="88" y="29" text-anchor="middle" class="pill-text">🧀 Nacho Week</text></g>
  </g>

  <g transform="translate(370, 377)">
    <g transform="translate(0, 0)"><rect width="235" height="46" rx="23" fill="#FFF8EE" /><text x="117.5" y="29" text-anchor="middle" class="pill-text">🧊 Summer of Slushies</text></g>
    <g transform="translate(251, 0)"><rect width="170" height="46" rx="23" fill="#FFF8EE" /><text x="85" y="29" text-anchor="middle" class="pill-text">🥗 Salad Week</text></g>
  </g>

  <line x1="300" y1="465" x2="900" y2="465" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <g transform="translate(600, 520)" text-anchor="middle">
    <text class="footer-badge">
      <tspan fill="#E85B38">✓</tspan> 100% Free &amp; Open Source   &#160;•&#160;   
      <tspan fill="#E85B38">✓</tspan> No Account Required   &#160;•&#160;   
      <tspan fill="#E85B38">✓</tspan> Custom Food Crawls
    </text>
  </g>
</svg>
