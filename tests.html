<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDX Food Week - Test Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --pizza: #B5472E;
      --pizza-dark: #8C3420;
      --pizza-light: #F2DFD8;
      --ink: #1A1208;
      --ink-70: rgba(26, 18, 8, 0.72);
      --ink-60: rgba(26, 18, 8, 0.60);
      --ink-20: rgba(26, 18, 8, 0.20);
      --cream: #FBF6EF;
      --border: rgba(26, 18, 8, 0.12);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 20px rgba(26, 18, 8, 0.08);
      --green: #3A5A29;
      --green-light: #E7EEDD;
      --red: #8B3C26;
      --red-light: #F2E2DD;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #E8E0D5;
      color: var(--ink);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      background: var(--ink);
      color: var(--cream);
      padding: 24px 32px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      font-style: italic;
      color: var(--cream);
    }

    .header-title p {
      font-size: 14px;
      color: rgba(251, 246, 239, 0.7);
      margin-top: 4px;
    }

    .header-controls {
      display: flex;
      gap: 12px;
    }

    button.btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-primary {
      background: var(--pizza);
      color: #fff;
    }

    button.btn-primary:hover {
      background: var(--pizza-dark);
    }

    button.btn-secondary {
      background: rgba(251, 246, 239, 0.1);
      color: var(--cream);
      border: 1px solid rgba(251, 246, 239, 0.2);
    }

    button.btn-secondary:hover {
      background: rgba(251, 246, 239, 0.2);
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-val {
      font-size: 36px;
      font-weight: 700;
      color: var(--ink);
    }

    .stat-lbl {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-60);
    }

    /* Progress bar */
    .progress-container {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar-bg {
      background: var(--ink-20);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--pizza);
      width: 0%;
      height: 100%;
      transition: width 0.3s ease;
    }

    /* Workspace */
    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 900px) {
      .workspace {
        grid-template-columns: 1.2fr 0.8fr;
      }
    }

    /* Test list panel */
    .panel {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background: var(--ink);
      color: var(--cream);
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-list {
      display: flex;
      flex-direction: column;
      divide-y: 1px solid var(--border);
    }

    .test-case {
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .test-case:last-child {
      border-bottom: none;
    }

    .test-case.running {
      background: rgba(201, 75, 44, 0.03);
    }

    .test-case.passed {
      background: rgba(47, 99, 22, 0.02);
    }

    .test-case.failed {
      background: rgba(139, 48, 21, 0.02);
    }

    .test-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-name {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .status-badge.pending {
      background: var(--ink-20);
      color: var(--ink-70);
    }

    .status-badge.active {
      background: var(--pizza-light);
      color: var(--pizza-dark);
      animation: pulse 1.5s infinite;
    }

    .status-badge.success {
      background: var(--green-light);
      color: var(--green);
    }

    .status-badge.fail {
      background: var(--red-light);
      color: var(--red);
    }

    .test-duration {
      font-size: 12px;
      color: var(--ink-60);
    }

    .test-logs {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      background: #1A1208;
      color: #A4B29F;
      padding: 12px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      max-height: 240px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-entry.info { color: #A4B29F; }
    .log-entry.pass { color: #72C063; }
    .log-entry.error { color: #F06E57; font-weight: bold; }

    /* Live Preview Panel */
    .preview-panel {
      height: 700px;
      display: flex;
      flex-direction: column;
    }

    .iframe-wrapper {
      flex: 1;
      width: 100%;
      background: #fff;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-title">
      <h1>Integration Test Dashboard</h1>
      <p>Automated visual E2E test runs on index.html within a sandboxed environment</p>
    </div>
    <div class="header-controls">
      <button class="btn btn-secondary" onclick="toggleIframe()">Toggle Live Preview</button>
      <button class="btn btn-primary" id="run-btn" onclick="runAllTests()">Run All Tests</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-val" id="stat-total">0</span>
      <span class="stat-lbl">Total Tests</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-passed" style="color: var(--green);">0</span>
      <span class="stat-lbl">Passed</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-failed" style="color: var(--red);">0</span>
      <span class="stat-lbl">Failed</span>
    </div>
    <div class="stat-card">
      <span class="stat-val" id="stat-time">0ms</span>
      <span class="stat-lbl">Elapsed Time</span>
    </div>
  </div>

  <div class="progress-container">
    <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:500;">
      <span>Overall Progress</span>
      <span id="progress-text">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="workspace">
    <!-- Test List Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Test Suite Checklist</span>
        <span style="font-size:12px; color:rgba(255,255,255,0.6)">7 Cases Defined</span>
      </div>
      <div class="test-list" id="test-list-container">
        <!-- Dyn. Populated -->
      </div>
    </div>

    <!-- Live Preview Panel -->
    <div class="panel preview-panel" id="preview-panel" style="display: none;">
      <div class="panel-header">
        <span>Active Test Sandbox Preview</span>
        <span style="font-size:12px; padding:2px 6px; border-radius:4px; background:var(--pizza); color:#fff;">Live</span>
      </div>
      <div class="iframe-wrapper">
        <iframe id="test-iframe"></iframe>
      </div>
    </div>
  </div>

  <!-- Consolidated Error Log Panel -->
  <div class="panel" id="error-log-panel" style="display: none; margin-top: 20px;">
    <div class="panel-header" style="background: var(--red); color: #fff;">
      <span>Consolidated Error Logs</span>
      <button class="btn btn-secondary" id="copy-errors-btn" onclick="copyErrorLogs()" style="padding: 4px 12px; font-size: 12px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);">Copy Errors</button>
    </div>
    <div style="padding: 16px; background: #1A1208; color: #FAF2F0; font-family: 'DM Mono', monospace; font-size: 13px; width: 100%;">
      <textarea id="error-log-textarea" readonly style="width: 100%; height: 160px; background: transparent; color: #FAF2F0; border: none; font-family: inherit; font-size: inherit; resize: none; outline: none;"></textarea>
    </div>
  </div>
</div>

<script>
  let testQueue = [];
  let currentTestIndex = 0;
  let testStartTime = 0;
  let passedCount = 0;
  let failedCount = 0;
  let errorLogs = [];

  // ── Helper: Assertions ──────────────────────────────────────
  function assert(condition, message) {
    if (!condition) throw new Error(message || "Assertion failed");
  }

  function assertEqual(actual, expected, message) {
    if (actual !== expected) {
      throw new Error((message ? message + ": " : "") + `Expected [${expected}] but got [${actual}]`);
    }
  }

  function assertContains(sourceString, searchString, message) {
    if (!sourceString || !sourceString.includes(searchString)) {
      throw new Error((message ? message + ": " : "") + `Expected "${sourceString}" to contain "${searchString}"`);
    }
  }

  // ── Helper: Toggle Preview ──────────────────────────────────
  function toggleIframe() {
    const p = document.getElementById('preview-panel');
    p.style.display = p.style.display === 'none' ? 'flex' : 'none';
  }

  // ── Helper: Sandbox Reloader ────────────────────────────────
  function reloadSandbox(queryString = '', clearStorage = true) {
    return new Promise(async (resolve, reject) => {
      const iframe = document.getElementById('test-iframe');
      if (clearStorage) {
        try {
          iframe.contentWindow.localStorage.clear();
        } catch (e) {}
      }
      
      const targetSearch = '?test=true' + (queryString ? '&' + queryString : '');
      
      // 1. Reset to about:blank to guarantee unload of previous document
      iframe.src = 'about:blank';
      
      // Wait up to 1 second for about:blank reset to complete
      let resetPassed = false;
      for (let i = 0; i < 20; i++) {
        try {
          if (iframe.contentWindow.location.href.includes('about:blank')) {
            resetPassed = true;
            break;
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 50));
      }
      
      // 2. Set the target destination URL
      iframe.src = './' + targetSearch;
      console.log(`reloadSandbox: Reset done. Loading target: ${targetSearch}`);
      
      // 3. Poll for target page to be fully loaded and initialized
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        try {
          const win = iframe.contentWindow;
          const doc = iframe.contentDocument;
          const search = win.location.search;
          const hasApp = !!(win.App);
          const rState = doc ? doc.readyState : 'unknown';
          
          if (attempts % 15 === 1 || hasApp) {
            console.log(`Poll #${attempts}: href='${win.location.href}', search='${search}', hasApp=${hasApp}, readyState='${rState}'`);
          }
          
          // Ensure we are on the same-origin index.html (search contains test=true)
          if (search.includes('test=true')) {
            if (hasApp && (rState === 'interactive' || rState === 'complete')) {
              clearInterval(interval);
              console.log(`reloadSandbox: Successfully loaded ${targetSearch}`);
              setTimeout(() => resolve(iframe), 150);
              return;
            }
          }
        } catch (e) {
          // Ignore transient cross-origin errors during transition
          if (attempts % 15 === 1) {
            console.log(`Poll #${attempts}: cross-origin / loading transition error:`, e);
          }
        }
        
        if (attempts > 80) { // 4 seconds timeout
          clearInterval(interval);
          reject(new Error("Timeout waiting for sandbox to load: " + targetSearch));
        }
      }, 50);
    });
  }

  // ── Helper: Wait Async ──────────────────────────────────────
  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // ── Define Test Cases ───────────────────────────────────────
  const testCases = [
    {
      id: "smoke",
      name: "Smoke Test - App Loader & Landing Week Selector",
      fn: async (iframe, log) => {
        log("Loading main page with no week selected...");
        await reloadSandbox();
        
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument;

        assert(win.App, "App namespace should exist on window");
        
        log("Initializing App manually...");
        win.App.init();
        await wait(200);

        log("Asserting that landing page elements are visible...");
        const landing = doc.getElementById('view-landing');
        assertEqual(landing.style.display || getComputedStyle(landing).display, 'block', "Landing page should be active by default");
        
        const grid = doc.getElementById('landing-grid');
        assert(grid.children.length > 0, "Landing week grid should populate color blocks for each week");
        
        log("Simulating click on Pizza Week 2026...");
        const pizzaLink = doc.querySelector('a[href*="week=pizza-2026"]');
        assert(pizzaLink, "Pizza Week selector link should be present on landing grid");
        
        // Mock switchWeek internally to intercept navigation
        pizzaLink.click();
        await wait(200);

        // Verify active week switched
        assertEqual(win.App.switchWeek ? doc.getElementById('header-title').textContent.trim() : '', "Pizza Week 2026", "Header title should reflect loaded week name");
        log("Successfully navigated from landing grid to browse view.", "pass");
      }
    },
    {
      id: "deeplink",
      name: "Deep-Linking Navigation & Invalid Dish Fallback",
      fn: async (iframe, log) => {
        log("Loading page with active week and valid dish deep-link ID...");
        await reloadSandbox("week=pizza-2026&dish=233600");
        
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument;

        log("Initializing App manually...");
        win.App.init();
        await wait(300);

        log("Asserting that detail sheet opened automatically...");
        const overlay = doc.getElementById('detail-overlay');
        assert(overlay.classList.contains('open'), "Detail overlay sheet should have 'open' class active");

        const content = doc.getElementById('detail-sheet-content');
        assertContains(content.textContent, "Mediterranean Mojo Lamb", "Details pane should display Mojo Lamb details");
        assertContains(content.textContent, "Clarklewis", "Details pane should display restaurant Clarklewis");

        log("Closing detail overlay...");
        win.App.closeDetail();
        assert(!overlay.classList.contains('open'), "Detail overlay should close successfully");

        log("Loading page with invalid deep-link dish ID...");
        await reloadSandbox("week=pizza-2026&dish=999999");
        iframe.contentWindow.App.init();
        await wait(200);

        const overlay2 = iframe.contentDocument.getElementById('detail-overlay');
        assert(!overlay2.classList.contains('open'), "Detail sheet should remain closed for nonexistent dish IDs");
        log("Deep-linking and safety checks passed successfully.", "pass");
      }
    },
    {
      id: "bookmarks",
      name: "Bookmarks Persistence & LocalStorage Sync",
      fn: async (iframe, log) => {
        log("Loading Pizza Week 2026...");
        await reloadSandbox("week=pizza-2026");
        const win = iframe.contentWindow;
        win.App.init();
        await wait(200);

        log("Verifying initial bookmark state (should be empty)...");
        const doc = iframe.contentDocument;
        let activeBookmarks = doc.querySelectorAll('.dish-card.bookmarked');
        assertEqual(activeBookmarks.length, 0, "No cards should start as bookmarked");

        log("Finding first dish card and clicking its bookmark star button...");
        const card = doc.querySelector('.dish-card');
        const dishId = card.getAttribute('data-id');
        const bookmarkBtn = card.querySelector('.bookmark-btn');
        bookmarkBtn.click();
        await wait(200);

        const updatedCard = doc.querySelector(`.dish-card[data-id="${dishId}"]`);
        assert(updatedCard, "Updated card should exist in DOM");
        assert(updatedCard.classList.contains('bookmarked'), "Card element should receive '.bookmarked' class");
        assert(updatedCard.querySelector('.bookmark-btn').classList.contains('saved'), "Bookmark button should have '.saved' class state");

        log("Reloading iframe *without* clearing localStorage to verify persistence...");
        await reloadSandbox("week=pizza-2026", false);
        iframe.contentWindow.App.init();
        await wait(200);

        const doc2 = iframe.contentDocument;
        const restoredCard = doc2.querySelector(`.dish-card[data-id="${dishId}"]`);
        assert(restoredCard.classList.contains('bookmarked'), "Bookmarked card state should persist in localStorage across page loads");
        log("Bookmarks persistent storage synchronized successfully.", "pass");
      }
    },
    {
      id: "search",
      name: "Search Input Filtering & Clear Button Integration",
      fn: async (iframe, log) => {
        log("Loading Pizza Week 2026...");
        await reloadSandbox("week=pizza-2026");
        iframe.contentWindow.App.init();
        await wait(200);

        const doc = iframe.contentDocument;
        const initialCount = doc.querySelectorAll('.dish-card').length;
        log(`Initial loaded dish card count: ${initialCount}`);
        assert(initialCount > 0, "There should be dish cards rendered");

        log("Typing 'vegan' in search input and triggering input event...");
        const searchInput = doc.getElementById('search-input');
        const clearBtn = doc.getElementById('search-clear-btn');
        
        searchInput.value = 'vegan';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(200);

        const filteredCount = doc.querySelectorAll('#cards-browse .dish-card').length;
        log(`Filtered dish card count: ${filteredCount}`);
        assert(filteredCount < initialCount, "Search should filter list down to a smaller subset");
        assertEqual(clearBtn.style.display || getComputedStyle(clearBtn).display, 'flex', "Clear button should display when search query is entered");

        // Verify matches
        doc.querySelectorAll('#cards-browse .dish-card').forEach(card => {
          assertContains(card.textContent.toLowerCase(), 'vegan', "Every matched card should contain 'vegan' text details");
        });

        log("Clicking the search clear button...");
        clearBtn.click();
        await wait(200);

        assertEqual(searchInput.value, '', "Search input value should be empty");
        assertEqual(clearBtn.style.display || getComputedStyle(clearBtn).display, 'none', "Clear button should be hidden");
        
        const restoredCount = doc.querySelectorAll('#cards-browse .dish-card').length;
        assertEqual(restoredCount, initialCount, "Clearing search should restore the initial card list");
        log("Search filter and clear actions verified successfully.", "pass");
      }
    },
    {
      id: "filter-minors",
      name: "Minors OK / Takeout OK Filtering",
      fn: async (iframe, log) => {
        log("Loading Pizza Week 2026...");
        await reloadSandbox("week=pizza-2026");
        iframe.contentWindow.App.init();
        await wait(200);

        const doc = iframe.contentDocument;
        const initialCount = doc.querySelectorAll('#cards-browse .dish-card').length;
        
        log("Finding the 'Minors OK' filter chip...");
        const filterChips = Array.from(doc.querySelectorAll('#browse-filters .filter-chip'));
        const minorsChip = filterChips.find(chip => chip.textContent.trim() === 'Minors OK');
        assert(minorsChip, "A filter chip with label 'Minors OK' should exist");
        
        log("Clicking 'Minors OK' filter chip...");
        minorsChip.click();
        await wait(200);

        const filteredCount = doc.querySelectorAll('#cards-browse .dish-card').length;
        log(`Filtered Minors OK card count: ${filteredCount} (initial was ${initialCount})`);
        assert(filteredCount < initialCount, "Minors OK filter should narrow the list");

        // Verify the tag exists on remaining cards
        let allHaveTag = true;
        doc.querySelectorAll('#cards-browse .dish-card').forEach(card => {
          if (!card.querySelector('.tag-minors')) allHaveTag = false;
        });
        assert(allHaveTag, "Every matched card should have the Minors OK tag");

        log("Toggling 'Minors OK' filter off...");
        minorsChip.click();
        await wait(200);

        assertEqual(doc.querySelectorAll('#cards-browse .dish-card').length, initialCount, "Toggling filter off should restore list");
        log("Filter verification complete.", "pass");
      }
    },
    {
      id: "detail-sheet",
      name: "Detail Sheet Description Parsing",
      fn: async (iframe, log) => {
        log("Loading Nacho Week 2026...");
        await reloadSandbox("week=nacho-2026");
        
        const win = iframe.contentWindow;
        const doc = iframe.contentDocument;

        // Mock a dish with all description fields
        const mockDish = {
          id: 999999,
          weekId: 'nacho-2026',
          dish: 'Test Nacho',
          restaurant: 'Test Place',
          desc: 'Base generic description',
          whatsOnIt: 'Cheese, Beans, Jalapenos',
          whatTheySay: 'The best nachos in town',
          lat: 45, lng: -122, type: 'meat'
        };
        win.RESTAURANTS.push(mockDish);
        
        win.App.init();
        await wait(200);
        
        log("Opening detail sheet with mock parsed data...");
        win.App.openDetail(999999);
        await wait(200);
        
        const whatsOnIt = doc.querySelector('.sheet-whats-on') || Array.from(doc.querySelectorAll('.sheet-desc')).find(el => el.textContent.includes('Cheese, Beans'));
        const whatTheySay = doc.querySelector('.sheet-what-they-say') || Array.from(doc.querySelectorAll('.sheet-desc')).find(el => el.textContent.includes('The best nachos in town'));
        
        assert(whatsOnIt, "Detail sheet should render whatsOnIt content");
        assert(whatTheySay, "Detail sheet should render whatTheySay content");
        
        log("Detail sheet description verification complete.", "pass");
      }
    },
    {
      id: "swipe",
      name: "Swipe Tinder Deck Layout Transforms & Responsive Modes",
      fn: async (iframe, log) => {
        log("Loading Pizza Week 2026...");
        await reloadSandbox("week=pizza-2026");
        const win = iframe.contentWindow;

  // ── Populated UI checklist ──────────────────────────────────
  function setupTestLayout() {
    const list = document.getElementById('test-list-container');
    list.innerHTML = '';
    
    testCases.forEach((tc, idx) => {
      const tcEl = document.createElement('div');
      tcEl.id = `tc-${tc.id}`;
      tcEl.className = 'test-case';
      tcEl.innerHTML = `
        <div class="test-head">
          <span class="test-name">
            <span class="status-badge pending" id="badge-${tc.id}">Pending</span>
            ${tc.name}
          </span>
          <span class="test-duration" id="time-${tc.id}">--</span>
        </div>
        <div class="test-logs" id="logs-${tc.id}" style="display: none;"></div>
      `;
      list.appendChild(tcEl);
    });

    document.getElementById('stat-total').textContent = testCases.length;
  }

  // ── Run Single Test ─────────────────────────────────────────
  async function runTestCase(tc) {
    const badge = document.getElementById(`badge-${tc.id}`);
    const tcEl = document.getElementById(`tc-${tc.id}`);
    const logsEl = document.getElementById(`logs-${tc.id}`);
    const durationEl = document.getElementById(`time-${tc.id}`);

    tcEl.className = 'test-case running';
    badge.className = 'status-badge active';
    badge.textContent = 'Active';
    logsEl.innerHTML = '';
    logsEl.style.display = 'flex';

    const testLog = (message, type = 'info') => {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      if (type === 'pass') {
        entry.innerHTML = `✔ ${message}`;
      } else if (type === 'error') {
        entry.innerHTML = `✘ ${message}`;
      } else {
        entry.innerHTML = `&nbsp;&nbsp; ${message}`;
      }
      logsEl.appendChild(entry);
      logsEl.scrollTop = logsEl.scrollHeight;
    };

    const startTime = performance.now();
    let passed = false;

    try {
      const iframe = document.getElementById('test-iframe');
      await tc.fn(iframe, testLog);
      passed = true;
    } catch (err) {
      testLog(err.message, 'error');
      errorLogs.push(`[${tc.name}]\n  ✘ ${err.message}`);
      console.error(err);
    }

    const elapsed = Math.round(performance.now() - startTime);
    durationEl.textContent = `${elapsed}ms`;

    if (passed) {
      badge.className = 'status-badge success';
      badge.textContent = 'Passed';
      tcEl.className = 'test-case passed';
      passedCount++;
      document.getElementById('stat-passed').textContent = passedCount;
    } else {
      badge.className = 'status-badge fail';
      badge.textContent = 'Failed';
      tcEl.className = 'test-case failed';
      failedCount++;
      document.getElementById('stat-failed').textContent = failedCount;
    }
  }

  // ── Run All Suite ───────────────────────────────────────────
  async function runAllTests() {
    const runBtn = document.getElementById('run-btn');
    runBtn.disabled = true;
    runBtn.textContent = 'Testing...';

    // Reset stats
    passedCount = 0;
    failedCount = 0;
    errorLogs = [];
    document.getElementById('error-log-panel').style.display = 'none';
    document.getElementById('error-log-textarea').value = '';
    document.getElementById('stat-passed').textContent = 0;
    document.getElementById('stat-failed').textContent = 0;
    document.getElementById('stat-time').textContent = '0ms';
    document.getElementById('progress-text').textContent = '0%';
    document.getElementById('progress-fill').style.width = '0%';
    setupTestLayout();

    const suiteStart = performance.now();

    for (let i = 0; i < testCases.length; i++) {
      const tc = testCases[i];
      await runTestCase(tc);
      
      // Update progress
      const pct = Math.round(((i + 1) / testCases.length) * 100);
      document.getElementById('progress-text').textContent = `${pct}%`;
      document.getElementById('progress-fill').style.width = `${pct}%`;
      
      const suiteElapsed = Math.round(performance.now() - suiteStart);
      document.getElementById('stat-time').textContent = `${suiteElapsed}ms`;
      await wait(300); // Small gap between tests for visual transition
    }

    runBtn.disabled = false;
    runBtn.textContent = 'Run All Tests';

    // Update Consolidated Error Log Panel
    const errorPanel = document.getElementById('error-log-panel');
    const errorTextarea = document.getElementById('error-log-textarea');
    if (errorLogs.length > 0) {
      errorTextarea.value = "=== PDX FOOD WEEK TEST RUN ERRORS ===\n\n" + errorLogs.join('\n\n');
      errorPanel.style.display = 'block';
    } else {
      errorPanel.style.display = 'none';
    }
  }

  function copyErrorLogs() {
    const txt = document.getElementById('error-log-textarea');
    const btn = document.getElementById('copy-errors-btn');
    if (!txt || !txt.value) return;
    
    navigator.clipboard.writeText(txt.value).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => {
        btn.textContent = 'Copy Errors';
      }, 2000);
    });
  }

  window.onload = () => {
    setupTestLayout();
    // Default open iframe
    toggleIframe();
    // Auto run on load
    runAllTests();
  };
