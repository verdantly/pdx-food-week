name: Scrape Slushie Week Every Other Day

on:
  push:
    paths:
      - 'scrape_slushies.js'
  schedule:
    # Run every other day at 12:00 AM Pacific Time (7:00 AM UTC in summer)
    - cron: '0 7 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    name: Run Scraper and Update Listings
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Date Boundary Check
        id: check-date
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            CURRENT_DATE=$(TZ="America/Los_Angeles" date +%Y-%m-%d)
            START_DATE="2026-07-15"
            echo "Current Date (Portland): $CURRENT_DATE"
            echo "Start Date: $START_DATE"
            if [[ ! "$CURRENT_DATE" < "$START_DATE" ]]; then
              echo "Slushie Week has already started or is in the past ($CURRENT_DATE >= $START_DATE)."
              echo "Stopping future automated runs."
              echo "should_skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Manual execution: bypassing date checks."
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Scraper
        if: steps.check-date.outputs.should_skip != 'true'
        run: node scrape_slushies.js

      - name: Commit and Push changes
        if: steps.check-date.outputs.should_skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet data/slushies2026.js; then
            echo "Changes detected in Slushie Week listings. Committing..."
            git add data/slushies2026.js
            git commit -m "Auto-update Slushie Week 2026 listings"
            git push
          else
            echo "No changes in Slushie Week listings."
          fi
